<!doctype html>
<html lang="en" data-theme="brutal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Prep — Pith</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      display: flex;
      font-family: var(--font-mono, monospace);
      background: var(--ui-surface-sunken);
      color: var(--ui-text);
    }

    /* ── Sidebar ──────────────────────────────────────────────────── */
    .sidebar {
      width: 216px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--ui-surface);
      border-right: var(--ui-border-width, 2px) solid var(--ui-border);
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-logo {
      padding: 1rem;
      font-size: var(--text-base, 1rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.05em;
      border-bottom: var(--ui-border-width, 2px) solid var(--ui-border);
      user-select: none;
    }
    .topic-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      font-size: var(--text-xs, 0.75rem);
      letter-spacing: -0.02em;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .topic-item:hover { background: var(--ui-surface-sunken); }
    .topic-item.active {
      background: var(--ui-primary);
      color: var(--ui-primary-fg);
    }
    .topic-count { opacity: 0.55; font-size: 0.7rem; }
    .topic-item.active .topic-count { opacity: 0.7; }

    /* ── Main ─────────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1.25rem;
      background: var(--ui-surface);
      border-bottom: var(--ui-border-width, 2px) solid var(--ui-border);
      flex-shrink: 0;
    }
    .view-title {
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.04em;
      cursor: pointer;
      user-select: none;
      padding: 0.25rem 0.5rem;
      border: var(--ui-border-width, 2px) solid transparent;
    }
    .view-title:hover { border-color: var(--ui-border); }
    .view-sep { color: var(--ui-text-subtle); font-size: var(--text-xs, 0.75rem); }
    .topbar-spacer { flex: 1; }
    .icon-btn {
      all: unset;
      cursor: pointer;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-xs, 0.75rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.02em;
      padding: 0.25rem 0.625rem;
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      background: var(--ui-surface-sunken);
      color: var(--ui-text-muted);
    }
    .icon-btn:hover { color: var(--ui-text); background: var(--ui-surface); }

    /* ── Problems view ────────────────────────────────────────────── */
    #problems-view { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 1.25rem;
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .chip {
      all: unset;
      cursor: pointer;
      font-family: var(--font-mono, monospace);
      font-size: 0.7rem;
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.01em;
      padding: 0.2rem 0.5rem;
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      background: transparent;
      color: var(--ui-text-muted);
    }
    .chip:hover { color: var(--ui-text); }
    .chip.on { background: var(--ui-primary); color: var(--ui-primary-fg); border-color: var(--ui-primary); }
    .chip-sep { width: 1px; height: 1.25rem; background: var(--ui-border); margin: 0 0.125rem; }
    .stats { margin-left: auto; font-size: 0.7rem; color: var(--ui-text-muted); letter-spacing: -0.02em; }

    /* ── Add form ─────────────────────────────────────────────────── */
    .add-form {
      display: none;
      flex-wrap: wrap;
      gap: 0.625rem;
      align-items: flex-end;
      padding: 0.75rem 1.25rem;
      background: var(--ui-surface-sunken);
      border-bottom: var(--ui-border-width, 2px) solid var(--ui-border);
      flex-shrink: 0;
    }
    .add-form.open { display: flex; }
    .add-form label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: var(--ui-text-muted);
      letter-spacing: -0.01em;
    }
    .add-form input, .add-form select {
      background: var(--ui-surface);
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      color: var(--ui-text);
      font-family: var(--font-mono, monospace);
      font-size: var(--text-sm, 0.875rem);
      padding: 0.3rem 0.5rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }
    .add-form input:focus, .add-form select:focus {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: -2px;
    }
    .add-form select option { background: var(--ui-surface); color: var(--ui-text); }
    .submit-btn {
      all: unset;
      cursor: pointer;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.02em;
      padding: 0.3rem 0.875rem;
      background: var(--ui-primary);
      color: var(--ui-primary-fg);
      border: var(--ui-border-width, 2px) solid var(--ui-primary);
    }
    .submit-btn:hover { opacity: 0.85; }
    .cancel-btn {
      all: unset;
      cursor: pointer;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.02em;
      padding: 0.3rem 0.875rem;
      background: transparent;
      color: var(--ui-text-muted);
      border: var(--ui-border-width, 2px) solid var(--ui-border);
    }
    .cancel-btn:hover { color: var(--ui-text); }

    /* ── Problem list ─────────────────────────────────────────────── */
    #problem-list { flex: 1; overflow-y: auto; }

    .problem-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1.25rem;
      background: var(--ui-surface);
      border-bottom: 1px solid var(--ui-border);
    }
    .problem-row:hover { background: var(--ui-surface-sunken); }
    .problem-row.open { background: var(--ui-surface-sunken); }

    .status-btn {
      all: unset;
      cursor: pointer;
      width: 1.25rem;
      height: 1.25rem;
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 0.6rem;
      font-weight: 900;
      transition: background 60ms;
    }
    .status-btn[data-s="todo"]      { background: transparent; color: var(--ui-text-muted); }
    .status-btn[data-s="attempted"] { background: var(--ui-warning, #ffcc00); border-color: var(--ui-warning, #ffcc00); color: #000; }
    .status-btn[data-s="solved"]    { background: var(--ui-success, #00e666); border-color: var(--ui-success, #00e666); color: #000; }
    .status-btn[data-s="review"]    { background: var(--ui-danger,  #ff4040); border-color: var(--ui-danger,  #ff4040); color: #fff; }

    .problem-name {
      flex: 1;
      font-size: var(--text-sm, 0.875rem);
      letter-spacing: -0.02em;
      cursor: pointer;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .problem-name:hover { text-decoration: underline; }

    .diff {
      font-size: 0.7rem;
      font-weight: var(--weight-bold, 700);
      padding: 0.125rem 0.375rem;
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .diff.easy   { color: var(--ui-success, #00e666); }
    .diff.medium { color: var(--ui-warning, #ffcc00); }
    .diff.hard   { color: var(--ui-danger,  #ff4040); }

    .ext-link {
      font-size: var(--text-xs, 0.75rem);
      color: var(--ui-text-subtle);
      text-decoration: none;
      flex-shrink: 0;
    }
    .ext-link:hover { color: var(--ui-text); }

    .notes-row {
      padding: 0.5rem 1.25rem 0.625rem 3.5rem;
      background: var(--ui-surface-sunken);
      border-bottom: 1px solid var(--ui-border);
    }
    .notes-row textarea {
      width: 100%;
      background: var(--ui-surface);
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      color: var(--ui-text);
      font-family: var(--font-mono, monospace);
      font-size: var(--text-sm, 0.875rem);
      padding: 0.5rem 0.625rem;
      resize: vertical;
      min-height: 4.5rem;
      letter-spacing: -0.02em;
    }
    .notes-row textarea:focus {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: -2px;
    }

    .empty {
      padding: 3rem 1.25rem;
      text-align: center;
      color: var(--ui-text-subtle);
      font-size: var(--text-sm, 0.875rem);
    }

    /* ── Timer view ───────────────────────────────────────────────── */
    #timer-view {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 2rem;
    }
    .timer-display {
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.06em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      transition: color 300ms;
    }
    .timer-display.running { color: var(--ui-success, #00e666); }
    .timer-display.done    { color: var(--ui-danger,  #ff4040); }

    .timer-controls { display: flex; gap: 0.5rem; }
    .timer-btn {
      all: unset;
      cursor: pointer;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--weight-bold, 700);
      letter-spacing: -0.02em;
      padding: 0.5rem 1.5rem;
      border: var(--ui-border-width, 2px) solid var(--ui-border);
      background: var(--ui-surface-sunken);
      color: var(--ui-text);
    }
    .timer-btn:hover { background: var(--ui-surface); }
    .timer-btn.primary { background: var(--ui-primary); color: var(--ui-primary-fg); border-color: var(--ui-primary); }
    .timer-btn.primary:hover { opacity: 0.85; }

    .timer-hint { font-size: 0.75rem; color: var(--ui-text-subtle); letter-spacing: -0.01em; }
  </style>
</head>
<body>

  <!-- ── Sidebar ──────────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">DSA PREP</div>
    <nav id="topic-nav"></nav>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────────── -->
  <div class="main">

    <header class="topbar">
      <span class="view-title" id="btn-problems">PROBLEMS</span>
      <span class="view-sep">/</span>
      <span class="view-title" id="btn-timer">TIMER</span>
      <span class="topbar-spacer"></span>
      <pith-input id="search-inp" placeholder="search…" size="sm" style="width:200px"></pith-input>
      <button class="icon-btn" id="dark-btn">DARK</button>
    </header>

    <!-- Problems -->
    <div id="problems-view">
      <div class="filter-bar" id="filter-bar"></div>
      <div class="add-form" id="add-form">
        <label>Name<input id="f-name" type="text" placeholder="Problem name" style="width:210px" /></label>
        <label>Topic<select id="f-topic"></select></label>
        <label>Difficulty
          <select id="f-diff">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
        <label>LeetCode URL<input id="f-url" type="url" placeholder="https://leetcode.com/problems/…" style="width:280px" /></label>
        <button class="submit-btn" id="add-submit">ADD</button>
        <button class="cancel-btn" id="add-cancel">CANCEL</button>
      </div>
      <div id="problem-list"></div>
    </div>

    <!-- Timer -->
    <div id="timer-view">
      <div id="timer-display" class="timer-display">45:00</div>
      <pith-slider id="timer-slider" min="5" max="90" step="5" value="45"
        label="Duration (minutes)" style="width:min(380px,90vw)"></pith-slider>
      <div class="timer-controls">
        <button class="timer-btn primary" id="timer-start">START</button>
        <button class="timer-btn" id="timer-reset">RESET</button>
      </div>
      <span class="timer-hint" id="timer-hint">set a duration and start</span>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
