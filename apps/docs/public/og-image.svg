<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a18"/>
      <stop offset="1" stop-color="#2a2a26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- three theme swatches -->
  <g transform="translate(96,120)">
    <rect x="0"   y="0" width="150" height="150" rx="20" fill="#fafaf8"/>
    <rect x="180" y="0" width="150" height="150" rx="20" fill="none" stroke="#8ab4ff" stroke-width="3" opacity="0.85"/>
    <rect x="360" y="0" width="150" height="150" rx="4"  fill="#f5d90a" stroke="#fafaf8" stroke-width="5"/>
  </g>

  <text x="96" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#fafaf8">pith</text>
  <text x="102" y="470" font-family="system-ui, sans-serif" font-size="40" fill="#c8c8c0">Components with character.</text>
  <text x="102" y="530" font-family="system-ui, sans-serif" font-size="28" fill="#8a8a82" letter-spacing="1">Three themes · One API · Zero framework lock-in</text>
</svg>
